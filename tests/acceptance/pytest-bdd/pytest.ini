[pytest]
# The feature files are shared with the Cucumber suite, so they live one level up.
bdd_features_base_dir = ../features
# A scenario whose step has no definition must fail, not be skipped.
addopts = --strict-markers -p no:cacheprovider
markers =
    issue-1: customer issue #1, register and manage vehicles
    issue-2: customer issue #2, ingest vehicle telemetry
