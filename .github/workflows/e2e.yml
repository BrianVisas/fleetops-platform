name: e2e

# Browser tests of the dashboard against the whole stack, built from this commit
# and started with Compose. The same tests run in Playwright for TypeScript and
# for Java (ADR-0007), each in Chromium, Firefox and WebKit.
# The traceability check in acceptance.yml counts them towards their issues.
# See tests/e2e/README.md.
#
# No path filter, for the same reason as acceptance.yml: the result is about the
# system, and a workflow that always reports can later become a required check.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [playwright-ts, playwright-java]
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml
      WEB_UI_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: $COMPOSE up --detach --build --wait --wait-timeout 300

      - name: Set up Node.js
        if: matrix.suite == 'playwright-ts'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/playwright-ts/package-lock.json

      - name: Set up JDK 21
        if: matrix.suite == 'playwright-java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/e2e/playwright-java/pom.xml

      # Installs the browsers and their system libraries, then runs the tests in
      # all three browsers.
      - name: Run the ${{ matrix.suite }} suite
        run: tests/e2e/${{ matrix.suite }}/run.sh

      # Traces and screenshots of failed tests are in here; a trace opens at
      # https://trace.playwright.dev or with `npx playwright show-trace`.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite }}
          path: tests/e2e/${{ matrix.suite }}/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes
