name: e2e

# Browser tests of the dashboard against the whole stack, started with Compose
# from the images ci.yml built for this commit. The same tests run in Playwright
# for TypeScript and for Java (ADR-0007), each in Chromium, Firefox and WebKit.
# The traceability check in acceptance.yml counts them towards their issues.
# See tests/e2e/README.md.
#
# Called by ci.yml on every pull request, every push to main and every night
# (ADR-0009). No path filter, for the same reason as acceptance.yml: the result
# is about the system, and a check that always reports can later be required.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [playwright-ts, playwright-java]
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml
      # The compose file names its images fleetops/<service>:${FLEETOPS_TAG}.
      FLEETOPS_TAG: ci
      WEB_UI_URL: http://localhost:3000
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/load-images

      # --no-build: the stack runs the images ci.yml built, nothing is built here.
      - name: Start the stack
        run: $COMPOSE up --detach --no-build --wait --wait-timeout 300

      # Each suite runs in Playwright's own image for the Playwright version it
      # is locked to. The browsers and every system library they need are baked
      # in, so nothing comes from the Ubuntu mirrors at run time (EL-023). The
      # version is read from the lock file and the pom, so a Dependabot bump of
      # Playwright moves the image with it.
      - name: Pick the Playwright image
        id: image
        shell: bash
        run: |
          if [ "$SUITE" = playwright-ts ]; then
            version=$(jq -r '.packages["node_modules/@playwright/test"].version' tests/e2e/playwright-ts/package-lock.json)
            image="mcr.microsoft.com/playwright:v${version}-noble"
          else
            version=$(sed -n 's:.*<playwright.version>\(.*\)</playwright.version>.*:\1:p' tests/e2e/playwright-java/pom.xml)
            image="mcr.microsoft.com/playwright/java:v${version}-noble"
          fi
          [ -n "$version" ] || { echo "no Playwright version found for $SUITE"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Playwright image: $image"

      - name: Cache Maven dependencies
        if: matrix.suite == 'playwright-java'
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: e2e-maven-${{ hashFiles('tests/e2e/playwright-java/pom.xml', 'tests/e2e/playwright-java/.mvn/wrapper/maven-wrapper.properties') }}

      # --network host: the stack is on this runner's localhost.
      # --ipc=host: what Playwright recommends for Chromium in Docker.
      - name: Run the ${{ matrix.suite }} suite
        timeout-minutes: 10
        run: >-
          docker run --rm --network host --ipc=host
          -v "$PWD:/work" -w /work
          -v "$HOME/.m2:/root/.m2"
          -e CI -e WEB_UI_URL
          "${{ steps.image.outputs.image }}"
          "tests/e2e/$SUITE/run.sh"

      # Traces and screenshots of failed tests are in here; a trace opens at
      # https://trace.playwright.dev or with `npx playwright show-trace`.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite }}
          path: tests/e2e/${{ matrix.suite }}/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes
