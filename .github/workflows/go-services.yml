name: go-services

on:
  pull_request:
    paths:
      - "services/telemetry-ingest/**"
      - "services/vehicle-sim/**"
      # fleet-api's migrations are the schema the ingest integration test applies.
      - "services/fleet-api/src/main/resources/db/migration/**"
      - ".github/workflows/go-services.yml"
  push:
    branches: [main]
    paths:
      - "services/telemetry-ingest/**"
      - "services/vehicle-sim/**"
      - "services/fleet-api/src/main/resources/db/migration/**"
      - ".github/workflows/go-services.yml"

permissions:
  contents: read

concurrency:
  group: go-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [telemetry-ingest, vehicle-sim]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          # Keyed on go.mod rather than go.sum: vehicle-sim has no dependencies,
          # so it has no go.sum, and a missing cache path fails the step.
          cache-dependency-path: services/${{ matrix.service }}/go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      # Only telemetry-ingest touches the database. vehicle-sim is a client and
      # has nothing to integrate against.
      - name: Integration tests
        if: matrix.service == 'telemetry-ingest'
        run: go test -tags=integration -count=1 -timeout=10m ./...

      - name: Build the binary
        run: go build -trimpath -o /tmp/${{ matrix.service }} .
