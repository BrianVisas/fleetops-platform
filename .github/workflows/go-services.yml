name: go-services

on:
  pull_request:
    paths:
      - "services/telemetry-ingest/**"
      - "services/vehicle-sim/**"
      # fleet-api's migrations are the schema the ingest integration test applies.
      - "services/fleet-api/src/main/resources/db/migration/**"
      - ".golangci.yml"
      - ".github/workflows/go-services.yml"
  push:
    branches: [main]
    paths:
      - "services/telemetry-ingest/**"
      - "services/vehicle-sim/**"
      - "services/fleet-api/src/main/resources/db/migration/**"
      - ".golangci.yml"
      - ".github/workflows/go-services.yml"

permissions:
  contents: read

concurrency:
  group: go-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage floors, not targets: they stop coverage sliding backwards.
          # Raise them as the untested paths (main, shutdown, store) get covered.
          - service: telemetry-ingest
            min_coverage: 50
          - service: vehicle-sim
            min_coverage: 33

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          # Keyed on go.mod rather than go.sum: vehicle-sim has no dependencies,
          # so it has no go.sum, and a missing cache path fails the step.
          cache-dependency-path: services/${{ matrix.service }}/go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: services/${{ matrix.service }}

      - name: Unit tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Enforce the coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "coverage: ${total}% (floor ${{ matrix.min_coverage }}%)"
          awk -v t="$total" -v m="${{ matrix.min_coverage }}" \
            'BEGIN { if (t + 0 < m + 0) { print "coverage below the floor"; exit 1 } }'

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out
          retention-days: 7

      - name: Integration tests
        # Only telemetry-ingest touches the database. vehicle-sim is a client and
        # has nothing to integrate against.
        if: matrix.service == 'telemetry-ingest'
        run: go test -tags=integration -count=1 -timeout=10m ./...

      - name: Build the binary
        run: go build -trimpath -o /tmp/${{ matrix.service }} .
