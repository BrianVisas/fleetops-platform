name: acceptance

# Black-box acceptance tests against the whole stack, built from this commit and
# started with Compose. Three suites run the same customer scenarios (ADR-0006),
# and a traceability check proves that every customer issue is covered by them.
# See tests/acceptance/README.md.
#
# No path filter: an acceptance result is about the system, and a workflow that
# always reports can later become a required check (ADR-0001).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  traceability:
    name: traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the customer issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues?labels=customer&state=all&per_page=100" > "$RUNNER_TEMP/issues.json"

      # The matrix also goes to the job summary, so it is readable on the run page.
      - name: Every customer issue has acceptance tests in every suite
        shell: bash
        run: python3 tests/acceptance/check_traceability.py --issues "$RUNNER_TEMP/issues.json" | tee -a "$GITHUB_STEP_SUMMARY"

  suite:
    name: acceptance (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [cucumber, pytest-bdd, robot]
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml
      FLEET_API_URL: http://localhost:8080
      TELEMETRY_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v7

      # --wait returns once every service is running and healthy, using the
      # health checks the images and the compose file already define.
      - name: Start the stack
        run: $COMPOSE up --detach --build --wait --wait-timeout 300

      - name: Set up JDK 21
        if: matrix.suite == 'cucumber'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/acceptance/cucumber/pom.xml

      - name: Set up Python
        if: matrix.suite != 'cucumber'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/acceptance/${{ matrix.suite }}/requirements.txt

      - name: Run the ${{ matrix.suite }} suite
        run: tests/acceptance/${{ matrix.suite }}/run.sh

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.suite }}
          path: tests/acceptance/${{ matrix.suite }}/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes
