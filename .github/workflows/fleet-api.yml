name: fleet-api

# Path filters are what keep a monorepo pipeline fast: a change to a Go service
# must not rebuild the Java one. The workflow file itself is included so that
# editing the pipeline still runs it.
on:
  pull_request:
    paths:
      - "services/fleet-api/**"
      - ".github/workflows/fleet-api.yml"
  push:
    branches: [main]
    paths:
      - "services/fleet-api/**"
      - ".github/workflows/fleet-api.yml"

permissions:
  contents: read

# A new push to the same branch cancels the previous run instead of queueing it.
concurrency:
  group: fleet-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/fleet-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and run unit tests
        run: ./mvnw -B -ntp test

      # Surefire writes XML and text reports; keeping them on a failed run means
      # the stack trace is readable without re-running the job locally.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-api-surefire-reports
          path: services/fleet-api/target/surefire-reports/
          retention-days: 7

      - name: Package the jar
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: fleet-api-jar
          path: services/fleet-api/target/*.jar
          retention-days: 7
