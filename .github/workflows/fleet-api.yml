name: fleet-api

on:
  pull_request:
    paths:
      - "services/fleet-api/**"
      - ".github/workflows/fleet-api.yml"
  push:
    branches: [main]
    paths:
      - "services/fleet-api/**"
      - ".github/workflows/fleet-api.yml"

permissions:
  contents: read

concurrency:
  group: fleet-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/fleet-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify runs surefire (*Test), then failsafe (*IT, Testcontainers), then
      # the JaCoCo coverage check. The runner has a Docker daemon already.
      - name: Unit tests, integration tests and coverage gate
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-api-test-reports
          path: |
            services/fleet-api/target/surefire-reports/
            services/fleet-api/target/failsafe-reports/
          retention-days: 7

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-api-jacoco
          path: services/fleet-api/target/site/jacoco/
          retention-days: 7

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: fleet-api-jar
          path: services/fleet-api/target/*.jar
          retention-days: 7
