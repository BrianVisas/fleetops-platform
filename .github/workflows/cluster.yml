name: cluster

# Creates the local kind cluster on a runner with the same scripts, versions,
# charts and manifests as on the Mac (infra/local, deploy/charts), checks that
# a request reaches Envoy through the port mapping, installs FleetOps into it
# (the database, and the services from the images ci.yml built for this
# commit), and runs the pytest-bdd acceptance suite against it through the
# gateway.
#
# Called by ci.yml on every pull request, every push to main and every night
# (ADR-0009). It used to run only when infra/local or deploy/charts changed;
# now that the services run on the cluster, a change to a service is a change
# to what runs there too.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  kind:
    name: kind cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned versions with the checksums the projects publish, from
      # infra/local/versions.env. kubectl comes with the runner image.
      - name: Install kind and Helm
        run: |
          . infra/local/versions.env
          curl -sSfLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind
          curl -sSfLo /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_LINUX_AMD64_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          kind version
          helm version --short
          kubectl version --client

      - name: Lint the charts
        run: |
          helm lint deploy/charts/*/
          for values in deploy/charts/fleetops-service/values-*.yaml; do
            helm lint deploy/charts/fleetops-service --values "$values"
          done

      # What Argo CD renders for every environment and service (deploy/gitops):
      # the service's values, then the environment's. And the platform's chart
      # versions in the Argo CD applications must match versions.env.
      - name: Check the GitOps configuration
        run: |
          for file in deploy/gitops/*.yaml deploy/gitops/*/*.yaml deploy/gitops/envs/*/*.yaml; do
            yq e 'true' "$file" >/dev/null || { echo "not valid YAML: $file"; exit 1; }
          done
          for env in deploy/gitops/envs/*/; do
            for values in deploy/charts/fleetops-service/values-*.yaml; do
              helm template x deploy/charts/fleetops-service --values "$values" --values "$env/values.yaml" >/dev/null
            done
            echo "renders: $(basename "$env")"
          done
          deploy/gitops/check-versions.sh

      - name: Create the cluster
        timeout-minutes: 10
        run: infra/local/cluster-up.sh

      - uses: ./.github/actions/load-images

      # IMAGE_TAG=ci: the images ci.yml built, loaded into the node instead of
      # built again.
      - name: Install FleetOps
        timeout-minutes: 15
        env:
          IMAGE_TAG: ci
          SIM: 1
        run: infra/local/install-fleetops.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/acceptance/pytest-bdd/requirements.txt

      # The same scenarios as acceptance.yml, against the cluster instead of
      # Compose. *.localhost needs no DNS on most systems; the hosts entry makes
      # sure of it for Python.
      - name: Acceptance tests on the cluster
        timeout-minutes: 10
        env:
          FLEET_API_URL: http://dev.fleetops.localhost:8000
          TELEMETRY_URL: http://dev.fleetops.localhost:8000
        run: |
          echo "127.0.0.1 dev.fleetops.localhost" | sudo tee -a /etc/hosts
          tests/acceptance/pytest-bdd/run.sh

      - name: Upload the acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-on-kind
          path: tests/acceptance/pytest-bdd/reports/
          retention-days: 14
          if-no-files-found: warn

      # What the cluster costs, for the laptop budget in docs/PHASE4.md.
      - name: Resource use
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          docker stats --no-stream

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get gatewayclass,gateway,envoyproxy,svc -A || true
          kubectl describe gateway fleetops -n envoy-gateway-system || true
          kubectl logs -n envoy-gateway-system deployment/envoy-gateway --tail=100 || true
          kubectl get events -n fleetops-dev --sort-by=.lastTimestamp || true
          kubectl get pods,svc,httproute -n fleetops-dev -o wide || true
          for d in fleet-api telemetry-ingest web-ui vehicle-sim; do
            kubectl logs -n fleetops-dev deployment/$d --tail=50 || true
          done
          kubectl describe cluster.postgresql.cnpg.io fleetops-db -n fleetops-dev || true
          kubectl logs -n cnpg-system deployment/cnpg-controller-manager --tail=100 || true

      - name: Delete the cluster
        if: always()
        run: infra/local/cluster-down.sh
