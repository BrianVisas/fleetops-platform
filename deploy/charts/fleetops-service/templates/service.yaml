{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetops-service.name" . }}
  labels:
    {{- include "fleetops-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fleetops-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
