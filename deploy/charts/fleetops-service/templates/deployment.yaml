apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetops-service.name" . }}
  labels:
    {{- include "fleetops-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "fleetops-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleetops-service.labels" . | nindent 8 }}
      annotations:
        # Environment variables are read once, at start: a changed ConfigMap
        # changes this checksum, and that rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The services never call the Kubernetes API, so they get no token for it.
      automountServiceAccountToken: false
      # What the images already do (uid 10001, non-root), stated so the
      # namespace's restricted pod security profile can check it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "fleetops-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- end }}
          {{- if .Values.config }}
          envFrom:
            - configMapRef:
                name: {{ include "fleetops-service.name" . }}
          {{- end }}
          {{- with .Values.secretEnv }}
          env:
            {{- range $variable, $ref := . }}
            - name: {{ $variable }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secret }}
                  key: {{ $ref.key }}
            {{- end }}
          {{- end }}
          {{- range $kind, $probe := .Values.probes }}
          {{ $kind }}Probe:
            httpGet:
              path: {{ $probe.path }}
              port: {{ $.Values.containerPort }}
            {{- with $probe.settings }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The root filesystem is read-only; /tmp is the one writable place
          # (the JVM's and nginx's temporary files).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
