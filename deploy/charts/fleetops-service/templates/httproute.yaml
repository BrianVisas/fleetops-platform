{{- if .Values.route.enabled }}
# Attaches this service to the cluster's Gateway (ADR-0008) for its paths on the
# environment's hostname. When paths of several services overlap, the longest
# prefix wins: /api goes to fleet-api even though web-ui serves /.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fleetops-service.name" . }}
  labels:
    {{- include "fleetops-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
    - matches:
        {{- range .Values.route.paths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "fleetops-service.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
