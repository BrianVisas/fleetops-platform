# One PostgreSQL cluster per environment, shared by fleet-api (which owns the
# schema and runs the Flyway migrations) and telemetry-ingest (ADR-0004).

# CloudNativePG names everything after the cluster: the primary's service is
# <name>-rw, the application credentials are in the secret <name>-app.
name: fleetops-db

# One instance: a laptop cluster has one node, so a replica would add memory and
# no availability. A cloud environment raises this to 3 (Phase 6).
instances: 1

# CloudNativePG's own PostgreSQL 17 image, pinned by digest. The same major
# version as the Compose stack (postgres:17).
image: ghcr.io/cloudnative-pg/postgresql:17.12-202611160820-minimal-trixie@sha256:67faf4bab0efe261d48975eaa4719e9807bbeeefb75b8d25b6543fe7c3539575

# The database and its owner, as in the Compose stack. The owner's password is
# generated by the operator and never leaves the cluster.
database: fleetops
owner: fleetops

storage:
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Sized for a laptop. fleet-api's pool (10) and telemetry-ingest's (20) fit in
# max_connections with room for the operator.
parameters:
  shared_buffers: 64MB
  max_connections: "50"
