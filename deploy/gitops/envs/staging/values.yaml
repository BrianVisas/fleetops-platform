# staging: what every service in fleetops-staging runs, on top of its own values
# file. It runs on the local cluster until Phase 6 gives it a cloud one
# (ADR-0010).
#
# A new image reaches staging by a pull request that copies dev's tag here
# (`make promote`, package 5), and reverting that pull request rolls it back.
image:
  tag: sha-0123d6f

imagePullSecrets:
  - name: ghcr-pull

route:
  host: staging.fleetops.localhost
