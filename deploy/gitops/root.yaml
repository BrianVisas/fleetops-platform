# The one Application applied by hand, by gitops-bootstrap.sh. Everything else
# on the cluster is an Application in apps/, which this one keeps in sync with
# main (app-of-apps, ADR-0010).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:BrianVisas/fleetops-platform.git
    targetRevision: main
    path: deploy/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
