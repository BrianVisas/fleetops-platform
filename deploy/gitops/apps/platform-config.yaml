# The cluster's own configuration from infra/local: the EnvoyProxy settings,
# the GatewayClass and the fleetops Gateway (gateway.yaml), and the namespaces
# the Gateway serves (namespaces.yaml). After Envoy Gateway, whose CRDs the
# gateway resources need.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: git@github.com:BrianVisas/fleetops-platform.git
    targetRevision: main
    path: infra/local
    directory:
      include: "{gateway.yaml,namespaces.yaml}"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Namespaces are never pruned: deleting one deletes the environment in it.
      prune: false
      selfHeal: true
