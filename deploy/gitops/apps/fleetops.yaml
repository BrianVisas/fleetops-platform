# The FleetOps environments: one Application per environment and component,
# generated from the lists below. On the local cluster that is dev, with every
# service including the simulator, which keeps traffic flowing.
#
# staging is not on the laptop: next to dev and Argo CD it starved the node
# and the Mac swapped (EL-033). Its values are in envs/staging, so promotion
# pull requests work already, and Phase 6 gives it a cluster of its own, where
# its entries come back into these lists. prod follows in Phase 6 too.
#
# Within an environment the components start in any order and settle: fleet-api
# waits for the database, and telemetry-ingest restarts until fleet-api has run
# the migrations. Kubernetes' restarts do the ordering; the probes keep traffic
# away until each service is ready.
#
# The image tag and the hostname of an environment are in envs/<env>/values.yaml.
# Moving dev to a new image is a change to that one file (package 5).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleetops-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: "fleetops-{{ .env }}-postgres"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: fleetops
      source:
        repoURL: git@github.com:BrianVisas/fleetops-platform.git
        targetRevision: main
        path: deploy/charts/fleetops-postgres
        helm:
          releaseName: fleetops-postgres
      destination:
        server: https://kubernetes.default.svc
        namespace: "fleetops-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleetops-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev, service: fleet-api }
          - { env: dev, service: telemetry-ingest }
          - { env: dev, service: web-ui }
          - { env: dev, service: vehicle-sim }
  template:
    metadata:
      name: "fleetops-{{ .env }}-{{ .service }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: fleetops
      sources:
        - repoURL: git@github.com:BrianVisas/fleetops-platform.git
          targetRevision: main
          path: deploy/charts/fleetops-service
          helm:
            releaseName: "{{ .service }}"
            # The service's own values, then the environment's.
            valueFiles:
              - "$values/deploy/charts/fleetops-service/values-{{ .service }}.yaml"
              - "$values/deploy/gitops/envs/{{ .env }}/values.yaml"
        - repoURL: git@github.com:BrianVisas/fleetops-platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "fleetops-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
