# The cluster's one entry point (ADR-0008): a Gateway that Envoy Gateway runs as
# an Envoy deployment. Applications attach to it with HTTPRoutes (Phase 4
# package 2), one hostname per environment:
#
#   http://dev.fleetops.localhost:8000      http://staging.fleetops.localhost:8000
#
# *.localhost resolves to 127.0.0.1 in browsers and in curl.

# How Envoy Gateway runs Envoy on kind: one small replica, exposed as a NodePort
# that kind-config.yaml maps to the Mac. A cloud cluster (Phase 6) uses its own
# EnvoyProxy with a LoadBalancer instead.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      envoyService:
        type: NodePort
        # Fix the NodePort, so the port mapping in kind-config.yaml can find it.
        # Service ports merge on "port": this changes only the listener's port 80.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fleetops
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.fleetops.localhost"
      # Only namespaces that opt in can attach routes; the FleetOps namespaces
      # carry this label.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              fleetops.io/gateway: "true"
