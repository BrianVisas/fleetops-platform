# nginx for the FleetOps dashboard: static files, plus /api proxied to fleet-api
# so the browser only ever talks to one origin (no CORS). Runs as a normal user,
# so every path it writes to is under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/fleetops-ui;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "UP\n";
        }

        # "fleet-api" is the service name in Compose and, from Phase 4, in Kubernetes.
        location /api/ {
            proxy_pass http://fleet-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
