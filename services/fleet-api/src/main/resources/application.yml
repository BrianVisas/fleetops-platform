spring:
  application:
    name: fleet-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleetops}
    username: ${DB_USER:fleetops}
    password: ${DB_PASSWORD:fleetops}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that it matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.fleetops: DEBUG

fleetops:
  rollout:
    auto-pause:
      # A rollout pauses itself when more than this share of its finished
      # installations failed (issue #6) ...
      failure-threshold: ${ROLLOUT_FAILURE_THRESHOLD:0.20}
      # ... but only once at least this many have finished.
      minimum-finished: ${ROLLOUT_MINIMUM_FINISHED:5}
